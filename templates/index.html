<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spam Detector | Modern Security</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--spam detector --> 
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            500: '#4f46e5',
                            600: '#4338ca',
                            700: '#3730a3',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-900">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12 animate-in">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500 text-white mb-6 shadow-lg shadow-brand-500/20">
                <i class="fas fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-4xl font-800 tracking-tight text-slate-900 mb-3">Spam Detector AI</h1>
            <p class="text-slate-500 text-lg max-w-md mx-auto">Advanced machine learning analysis to keep your inbox safe and clean.</p>
        </header>

        <div class="flex justify-center">
            <!-- Main Analysis Tool -->
            <div class="w-full max-w-2xl">
                <div class="glass-card rounded-3xl p-8 shadow-xl shadow-slate-200/50 animate-in">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-700 text-slate-800">Analyze Content</h2>
                        <span class="px-3 py-1 bg-brand-50 text-brand-600 rounded-full text-xs font-600 uppercase tracking-wider">Spam Scan</span>
                    </div>
                    
                    <div class="mb-6">
                        <label for="emailContent" class="block text-sm font-600 text-slate-700 mb-2">Message Content</label>
                        <textarea id="emailContent" 
                            class="w-full h-48 px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all duration-200 resize-none outline-none placeholder:text-slate-400"
                            placeholder="Paste the email text here... e.g., 'Congratulations! You've won a $1000 gift card!'"></textarea>
                    </div>

                    <button id="analyzeBtn" onclick="checkSpam()" 
                        class="w-full py-4 bg-brand-500 hover:bg-brand-600 text-white rounded-2xl font-700 transition-all duration-200 shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2 group">
                        <span id="btnText" class="group-hover:translate-x-1 transition-transform duration-200">Analyze Message</span>
                        <div id="btnLoader" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform duration-200" id="btnIcon"></i>
                    </button>

                    <!-- Result Display -->
                    <div id="resultContainer" class="hidden mt-8 p-6 rounded-2xl animate-in border">
                        <div class="flex items-center gap-4">
                            <div id="resultIcon" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-sm"></div>
                            <div>
                                <p class="text-sm font-600 opacity-60 uppercase tracking-wider">Classification</p>
                                <h3 id="resultValue" class="text-2xl font-800"></h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-16 text-center text-slate-400 text-sm animate-in" style="animation-delay: 0.3s">
            <p>&copy; 2026 AI Security Lab • Built with Precision</p>
        </footer>
    </div>

    <script>
        async function checkSpam() {
            const emailContent = document.getElementById('emailContent').value;
            const resultContainer = document.getElementById('resultContainer');
            const resultValue = document.getElementById('resultValue');
            const resultIcon = document.getElementById('resultIcon');
            const btn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const btnIcon = document.getElementById('btnIcon');
            
            if (!emailContent.trim()) {
                alert('Please enter some email content to analyze.');
                return;
            }

            // Loading state
            btn.disabled = true;
            btnText.classList.add('hidden');
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: emailContent })
                });

                const data = await response.json();
                
                resultContainer.classList.remove('hidden');
                resultValue.innerText = data.result;
                
                if (data.result === 'Spam') {
                    resultContainer.className = 'mt-8 p-6 rounded-2xl animate-in border bg-red-50 border-red-100 text-red-900';
                    resultIcon.className = 'w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-sm bg-red-500 text-white';
                    resultIcon.innerHTML = '<i class="fas fa-circle-exclamation"></i>';
                } else {
                    resultContainer.className = 'mt-8 p-6 rounded-2xl animate-in border bg-emerald-50 border-emerald-100 text-emerald-900';
                    resultIcon.className = 'w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-sm bg-emerald-500 text-white';
                    resultIcon.innerHTML = '<i class="fas fa-circle-check"></i>';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Is the server running?');
            } finally {
                btn.disabled = false;
                btnText.classList.remove('hidden');
                btnIcon.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
